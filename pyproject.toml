[project]
name = "toe-dac"
version = "0.4.1"
description = "Persistent interactive agent CLI based on the TOE-DAC control protocol"
requires-python = ">=3.12"
dependencies = [
    "questionary>=2.1",
    "rich>=13.0",
]

[project.scripts]
toe-dac = "toe_dac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toe_dac", "src/state_machine"]

[tool.hatch.build]
exclude = [
    "config/models.json",
    "data/**",
    "work/**",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
