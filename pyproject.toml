[project]
name = "toe-dac"
version = "0.6.0"
description = "Persistent interactive agent CLI based on the TOE-DAC control protocol"
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0",
    "questionary>=2.1",
    "rich>=13.0",
]

[project.scripts]
toe-dac = "toe_dac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toe_dac", "src/state_machine"]

[tool.hatch.build.targets.wheel.force-include]
"config/models.json" = "toe_dac/resources/models.json"
".env.example" = "toe_dac/resources/.env.example"
".env" = "toe_dac/resources/.env"
"runtime" = "toe_dac/resources/runtime"

[tool.hatch.build]
exclude = [
    "data/**",
    "work/**",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
