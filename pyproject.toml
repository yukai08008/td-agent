[project]
name = "toe-dac"
version = "0.1.0"
description = "Interactive TOE-DAC state-machine proof of concept"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13",
    "andy-state",
    "questionary>=2.1",
    "python-dotenv>=1.1",
    "rich>=13.0",
]

[project.scripts]
toe-dac = "toe_dac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toe_dac"]

[tool.hatch.build]
exclude = [
    "config/models.json",
    "data/**",
    "work/**",
]

[tool.uv.sources]
andy-state = { path = "../../andy_state", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
